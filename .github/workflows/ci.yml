# ============================================================================
# HAOYAO 官网 CI 流水线（GitHub Actions）
# 功能：PR 与 main 推送时执行 质量门禁（lint + test + build），全绿才允许合并。
# 依据：《HAOYAO_官网_开发技术文档.md》§3.6 CI/CD：
#   - Lint:  ESLint（前端）+ ruff check（后端）
#   - Test:  pytest（后端）
#   - Build: next build（前端产物校验）
# 说明：前端包管理采用 npm（apps/web 单包；2026-08-26 环境决策——
#   WorkBuddy 本地环境的删除保护与 pnpm symlink 结构冲突，故统一 npm）。
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- 后端：ruff + mypy + pytest ----------
  api:
    name: API (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest tests

  # ---------- 前端：ESLint + 类型检查 + 构建 ----------
  web:
    name: Web (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build (Next.js)
        run: npm run build
